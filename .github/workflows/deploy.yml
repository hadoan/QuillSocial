name: Deploy to Cloud Run

on:
  push:
    tags:
      - 'v*' # Triggers on tags like v1.0, v2.1.3, etc.
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: europe-west4 # Netherlands
  GAR_LOCATION: europe-west4
  REPOSITORY: corely-images
  IMAGE_NAME: quillsocial
  SERVICE_NAME: quillsocial-web
  JOB_NAME: quillsocial-migrate
  DATABASE_URL: ${{ secrets.DATABASE_URL }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate with Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Setup Node.js & Yarn
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable Corepack & Install dependencies
        run: |
          corepack enable
          yarn set version 3.4.1
          yarn install --immutable

      - name: Build Application
        run: yarn build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GAR_LOCATION }}-docker.pkg.dev
          username: _json_key
          password: ${{ secrets.GCP_CREDENTIALS }}

      - name: Build and Push App
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy API to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          flags: --port=3000 --allow-unauthenticated --cpu=1.0 --memory=1024Mi --min-instances=0 --max-instances=2 --cpu-throttling --concurrency=80
          env_vars: |
            NODE_ENV=production
            DATABASE_URL=${{ env.DATABASE_URL }}
            OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
            NEXTAUTH_SECRET=${{ secrets.NEXTAUTH_SECRET }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Run DB migrations (Cloud Run job)
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          SERVICE_ENV_JSON="$(gcloud run services describe "${{ env.SERVICE_NAME }}" --region "${{ env.REGION }}" --format=json)"
          SERVICE_ACCOUNT="$(jq -r '.spec.template.spec.serviceAccountName // .template.serviceAccount // empty' <<<"$SERVICE_ENV_JSON")"

          job_identity_args=()
          if [ -n "$SERVICE_ACCOUNT" ]; then
            job_identity_args=(--service-account "$SERVICE_ACCOUNT")
          fi
          
          # Pass the DATABASE_URL directly to the migration job since it needs to run migrations
          job_env_args=(--update-env-vars "^__ENV_DELIM__^NODE_ENV=production__ENV_DELIM__DATABASE_URL=${{ env.DATABASE_URL }}")

          if gcloud run jobs describe "${{ env.JOB_NAME }}" --region "${{ env.REGION }}" >/dev/null 2>&1; then
            gcloud run jobs update "${{ env.JOB_NAME }}" \
              --region "${{ env.REGION }}" \
              --image "$IMAGE" \
              --command "npx" \
              --args "prisma,migrate,deploy,--schema=./prisma/schema.prisma" \
              --cpu=1 \
              --memory=1Gi \
              --task-timeout=15m \
              --max-retries=0 \
              "${job_identity_args[@]}" \
              "${job_env_args[@]}"
          else
            gcloud run jobs create "${{ env.JOB_NAME }}" \
              --region "${{ env.REGION }}" \
              --image "$IMAGE" \
              --command "npx" \
              --args "prisma,migrate,deploy,--schema=./prisma/schema.prisma" \
              --cpu=1 \
              --memory=1Gi \
              --task-timeout=15m \
              --max-retries=0 \
              "${job_identity_args[@]}" \
              "${job_env_args[@]}"
          fi

          set +e
          execution_output="$(gcloud run jobs execute "${{ env.JOB_NAME }}" --region "${{ env.REGION }}" --wait 2>&1)"
          execution_status=$?
          set -e

          echo "$execution_output"

          if [ "$execution_status" -ne 0 ]; then
            execution_name="$(printf '%s\n' "$execution_output" | grep -Eo '${{ env.JOB_NAME }}-[a-z0-9]+' | tail -1 || true)"

            if [ -n "$execution_name" ]; then
              echo "::group::Cloud Run migration execution"
              gcloud run jobs executions describe "$execution_name" \
                --region "${{ env.REGION }}" \
                --format "yaml(name,completionTime,conditions,status)"
              echo "::endgroup::"

              echo "::group::Cloud Run migration logs"
              gcloud logging read \
                'resource.type="cloud_run_job" AND labels."run.googleapis.com/execution_name"="'"$execution_name"'"' \
                --limit=100 \
                --format='value(timestamp,severity,textPayload,jsonPayload.message,protoPayload.status.message)'
              echo "::endgroup::"
            fi

            exit "$execution_status"
          fi
