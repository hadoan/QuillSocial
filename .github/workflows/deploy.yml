name: Deploy to Cloud Run

on:
  push:
    tags:
      - 'v*' # Triggers on tags like v1.0, v2.1.3, etc.
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: europe-west4 # Netherlands
  GAR_LOCATION: europe-west4
  REPOSITORY: corely-images
  IMAGE_NAME: quillsocial
  SERVICE_NAME: quillsocial-web
  JOB_NAME: quillsocial-migrate
  DATABASE_URL: ${{ secrets.DATABASE_URL }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate with Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Setup Node.js & Yarn
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable Corepack & Install dependencies
        env:
          YARN_ENABLE_IMMUTABLE_INSTALLS: "false"
        run: |
          corepack enable
          yarn set version 3.4.1
          yarn install

      - name: Generate Prisma Client
        run: yarn workspace @quillsocial/prisma generate-schemas

      - name: Build Application
        env:
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          DATABASE_URL: ${{ env.DATABASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MY_APP_ENCRYPTION_KEY: "12345678901234567890123456789012"
          NEXTAUTH_URL: "http://localhost:3000/api/auth"
          NEXT_PUBLIC_WEBAPP_URL: "http://localhost:3000"
        run: yarn build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GAR_LOCATION }}-docker.pkg.dev
          username: _json_key
          password: ${{ secrets.GCP_CREDENTIALS }}

      - name: Build and Push App
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy API to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          flags: --port=3000 --allow-unauthenticated --cpu=1.0 --memory=1024Mi --min-instances=0 --max-instances=2 --cpu-throttling --concurrency=80
          env_vars: |
            NODE_ENV=production
            DATABASE_URL=${{ env.DATABASE_URL }}
            OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
            NEXTAUTH_SECRET=${{ secrets.NEXTAUTH_SECRET }}
            MY_APP_ENCRYPTION_KEY="12345678901234567890123456789012"
            NEXTAUTH_URL="http://localhost:3000/api/auth"
            NEXT_PUBLIC_WEBAPP_URL="http://localhost:3000"

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Run DB migrations
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
        run: yarn workspace @quillsocial/prisma db-deploy
